<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VitalU Pet Simulator</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1d2320;--mu:#6c746f;--ac:#2f8f6b;--bd:#e5e2da;--tr:#e8e5dc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121614;--card:#1c221f;--tx:#eef2ef;--mu:#93a09a;--ac:#48c596;--bd:#2a332f;--tr:#2a332f}}
:root[data-theme="dark"]{--bg:#121614;--card:#1c221f;--tx:#eef2ef;--mu:#93a09a;--ac:#48c596;--bd:#2a332f;--tr:#2a332f}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
body{min-height:100%}button{font:inherit;color:inherit}
#w{max-width:520px;margin:0 auto;padding:1rem}
h1,h2,h3{margin:0}.mu{color:var(--mu);font-size:.85rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:1.1rem;padding:1rem;margin-bottom:.8rem}
.top{display:flex;align-items:center;gap:.7rem;margin-bottom:.4rem}
.top img{width:2.6rem;height:2.6rem;border-radius:.7rem;image-rendering:pixelated;background:#050505}
.stage{text-align:center;position:relative}
.pet{height:11rem;display:flex;align-items:flex-end;justify-content:center}
.pet svg{transition:width .6s}
@keyframes bob{50%{transform:translateY(-6px)}}@keyframes hop{30%{transform:translateY(-22px) scale(1.06)}60%{transform:translateY(0) scale(.96)}}
.pet svg{animation:bob 2.4s ease-in-out infinite}.pet.hop svg{animation:hop .6s}
.bar{height:.7rem;background:var(--tr);border-radius:1rem;overflow:hidden;margin-top:.6rem}.bar i{display:block;height:100%;background:var(--ac);border-radius:1rem;transition:width .6s}
.float{position:absolute;left:50%;top:35%;font-weight:700;color:var(--ac);font-size:1.4rem;animation:fl 1.2s forwards;pointer-events:none}
@keyframes fl{to{transform:translate(-50%,-70px);opacity:0}}
.toast{background:var(--ac);color:#fff;border-radius:1rem;padding:.8rem;text-align:center;font-weight:600;margin-bottom:.8rem;display:none}
.task{display:flex;align-items:center;gap:.7rem;padding:.7rem 0;border-top:1px solid var(--bd)}.task:first-of-type{border-top:0}
.task .ic{font-size:1.5rem}.task .b{flex:1}.task b{display:block}
.btn{border:1px solid var(--ac);background:none;color:var(--ac);padding:.45rem .9rem;border-radius:2rem;cursor:pointer;font-size:.85rem}
.btn.f{background:var(--ac);color:#fff}.btn:disabled{opacity:.4;cursor:default}
.stages{display:flex;gap:.4rem;overflow-x:auto}.stages div{flex:1;min-width:4.2rem;text-align:center;font-size:.7rem;padding:.5rem .2rem;border-radius:.8rem;border:1px solid var(--bd);opacity:.45}
.stages div.on{opacity:1;border-color:var(--ac);background:var(--tr)}.stages div.got{opacity:1}
.stages .th{height:3.2rem;display:flex;align-items:flex-end;justify-content:center;margin-bottom:.3rem}
.sw{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.7rem}.sw1{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;display:block;position:relative}.sw1.on{border-color:var(--tx)}
.row{display:flex;gap:.5rem;flex-wrap:wrap}
</style></head><body><div id="w">
<div class="top"><img id="lg" alt="VitalU"><div><h1 style="font-size:1.3rem">Pet Simulator</h1><div class="mu">See how the pet grows as tasks are finished</div></div></div>
<div id="t" class="toast"></div>
<div class="card stage"><div id="pet" class="pet"></div><h2 id="nm" style="margin-top:.6rem"></h2><div class="mu" id="xt"></div><div class="bar"><i id="xb"></i></div><div class="mu" style="margin-top:.5rem" id="day"></div></div>
<div class="card"><h3>Today's tasks</h3><p class="mu" style="margin:.2rem 0 .4rem">Tap "Complete" to pretend the wearable data hit the goal. Each task can be done once per day.</p><div id="tk"></div></div>
<div class="card"><h3>Evolution path</h3><p class="mu" style="margin:.2rem 0 .6rem">Growth is slow on purpose: max 48 XP a day.</p><div class="stages" id="sg"></div></div>
<div class="card"><h3>Pet colour</h3><div class="sw" id="sw"></div></div>
<div class="card"><h3>Demo controls</h3><div class="row" style="margin-top:.6rem"><button class="btn f" onclick="nextDay()">⏭ Next day</button><button class="btn" onclick="boost()">🚀 Jump to next stage</button><button class="btn" onclick="reset()">↺ Reset</button></div></div>
</div>

const PAL=['#1f9d76','#4f8df0','#e5566d','#9b6cf0','#f0a34b','#e86bb0','#5fc7d6','#8a8f98'];
const mix=(h,t,a)=>'#'+[16,8,0].map(k=>Math.round((parseInt(h.slice(1),16)>>k&255)*(1-a)+t*a).toString(16).padStart(2,'0')).join('');
let xp=0,day=1,pc=PAL[0],done=[],fed=false;
const stage=()=>{let i=0;ST.forEach((x,k)=>{if(xp>=x[1])i=k});return i};
function art(i,w){const r=ART[i],C={g:pc,d:mix(pc,0,.3),w:mix(pc,255,.8),k:'#0b0b0b',y:'#f2c14e'};return `<svg viewBox="0 0 12 ${r.length}" shape-rendering="crispEdges" style="width:${w}rem">${r.map((row,y)=>[...row].map((c,x)=>c=='.'?'':`<rect x="${x}" y="${y}" width="1.02" height="1.02" fill="${C[c]}"/>`).join('')).join('')}</svg>`}

function add(n,why){const b=stage();xp+=n;const a=stage();render();const f=document.createElement('div');f.className='float';f.textContent='+'+n+' XP';$('.stage').appendChild(f);setTimeout(()=>f.remove(),1200);
const p=$('#pet');p.classList.remove('hop');void p.offsetWidth;p.classList.add('hop');toast(a>b?`🎉 Evolved into ${ST[a][0]}!`:why)}
function render(){const i=stage(),nx=ST[i+1];
$('#pet').innerHTML=art(i,6+i*1.7);$('#nm').textContent=ST[i][0]+' '+(fed?'😊':'🥺');
$('#xt').textContent=xp+' XP'+(nx?` · ${nx[1]-xp} to ${nx[0]}`:' · fully grown!');
$('#xb').style.width=(nx?(xp-ST[i][1])/(nx[1]-ST[i][1])*100:100)+'%';$('#day').textContent='Day '+day;
$('#tk').innerHTML=TASKS.map((t,k)=>`<div class="task"><span class="ic">${t[0]}</span><div class="b"><b>${t[1]}</b><span class="mu">${t[2]} quest · +${t[3]} XP</span></div><button class="btn f" ${done[k]?'disabled':''} onclick="doTask(${k})">${done[k]?'✓ Done':'Complete'}</button></div>`).join('')+`<div class="task"><span class="ic">🍎</span><div class="b"><b>Feed your pet</b><span class="mu">Daily feeding · +5 XP</span></div><button class="btn" ${fed?'disabled':''} onclick="feed()">${fed?'✓ Fed':'Feed'}</button></div>`;
$('#sg').innerHTML=ST.map((s,k)=>`<div class="${k==i?'on':k<i?'got':''}"><div class="th">${art(k,2.6)}</div><b>${s[0]}</b><br>${s[1]} XP</div>`).join('');
$('#sw').innerHTML=PAL.map(c=>`<button class="sw1 ${c==pc?'on':''}" style="background:${c}" aria-label="${c}" onclick="pc='${c}';render()"></button>`).join('')+`<label class="sw1" style="background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red)"><input type="color" value="${pc}" onchange="pc=this.value;render()" style="opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer"></label>`}
function doTask(k){if(done[k])return;done[k]=1;add(TASKS[k][3],`${TASKS[k][2]} quest complete!`)}
function feed(){if(fed)return;fed=true;add(5,'Yum! Your pet is happy 😊')}
function nextDay(){day++;done=[];fed=false;render();toast('New day: tasks reset')}
function boost(){const n=ST[stage()+1];if(n)add(n[1]-xp,'Demo boost!');}
function reset(){xp=0;day=1;done=[];fed=false;render()}
render();
</script></body></html>
